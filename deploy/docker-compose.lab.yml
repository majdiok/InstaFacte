# FactuTrust — overrides lab VMware Ubuntu 16 Go
# Usage (depuis la racine du dépôt sur la VM) :
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.lab.yml up -d --build

services:
  # Lab only: expose SQL Server for SSMS / Azure Data Studio from the Windows host
  sqlserver:
    ports:
      - "1433:1433"

  ollama:
    environment:
      # Limiter la concurrence de modèles chargés (16 Go RAM)
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

  api:
    environment:
      Smtp__Enabled: "false"
      # Lab : appliquer migrations tenant au boot pour simplifier les tests d'inscription
      TenantMigrations__ApplyOnStartup: "true"
      TenantMigrations__ApplyOnlyToMissingMigrations: "true"
      # Lab : activer l'inscription cabinets (OFF par défaut en Production VPS)
      Features__AccountingFirms__Enabled: "true"
      # Lab : verser automatiquement les paiements espèces vers la caisse
      Features__AutoCashFromInvoicePayment: "true"
      Features__AutoCashFromSupplierPayment: "true"

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
    # Pas de bind 443 en lab HTTP-only
