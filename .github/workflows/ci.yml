name: CI

# Dépôt actuellement sans remote : ce workflow s'activera automatiquement
# dès que le dépôt sera poussé sur GitHub. En attendant, utiliser
# scripts/verify-all.ps1 en local (mêmes étapes).
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend .NET (build + tests)
    runs-on: windows-latest # LocalDB requis par les tests d'intégration API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Démarrer LocalDB
        run: sqllocaldb start MSSQLLocalDB
      - name: Build
        run: dotnet build src/Backend/FactuTrust.sln --configuration Release
      - name: Tests (clé JWT de test requise par le fail-fast au démarrage)
        env:
          JwtSettings__SecretKey: ci-only-jwt-signing-key-not-a-secret-0123456789abcdef
        run: dotnet test src/Backend/FactuTrust.sln --configuration Release --no-build --verbosity minimal

  frontend-web:
    name: Web Angular (specs + build prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      - name: Specs Jasmine (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build production
        run: npm run build:prod

  frontend-web-e2e-smoke:
    name: Web Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke e2e (Chromium)
        run: npx playwright test e2e/sidebar-collapse.spec.ts e2e/test-backend-connection.spec.ts --project=chromium

  frontend-backoffice:
    name: Backoffice Angular (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/factutrust-backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-backoffice/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      - name: Build production
        run: npx ng build --configuration production
